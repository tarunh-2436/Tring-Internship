<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>

        Feedback Management Portal

    </title>

    <link
        rel="stylesheet"
        href="styles.css">

</head>

<body>

<div class="app">

    <!-- ===========================
                HEADER
    ============================ -->

    <header class="topbar">

        <div class="logo">

            <h1>

                Feedback Portal

            </h1>

        </div>

        <div class="topbar-right">

            <div
                id="user-status"
                class="user-status">

                Browsing as Guest

            </div>

            <button onclick="login()">

                Login

            </button>

            <button onclick="signup()">

                Sign Up

            </button>

            <button onclick="logout()">

                Logout

            </button>

        </div>

    </header>


    <!-- ===========================
                BODY
    ============================ -->

    <div class="body-container">

        <!-- =======================
                    SIDEBAR
        ======================== -->

        <aside class="sidebar">

            <button id="nav-home">

                🏠 Home

            </button>

            <button id="nav-submit">

                📝 Submit Feedback

            </button>

            <button id="nav-my-feedback">

                📂 My Feedback

            </button>

            <button
                id="admin-export"
                style="display:none;">

                🛡 Admin Dashboard

            </button>

        </aside>


        <!-- =======================
                CONTENT
        ======================== -->

        <main
            id="content">

        </main>

    </div>

</div>



<!-- =====================================================
                        HOME TEMPLATE
====================================================== -->

<template id="home-template">

<section class="page">

    <h2>

        Home

    </h2>

    <p>

        Welcome to the Feedback Management Portal.

    </p>

    <div class="dashboard-grid">

        <div class="dashboard-card">

            <h3>

                Submit Feedback

            </h3>

            <p>

                Create a new feedback submission.

            </p>

            <button
                onclick="navigate('submit')">

                Open

            </button>

        </div>

        <div class="dashboard-card">

            <h3>

                My Feedback

            </h3>

            <p>

                View your submitted feedback.

            </p>

            <button
                onclick="navigate('my-feedback')">

                Open

            </button>

        </div>

        <div class="dashboard-card">

            <h3>

                Admin Dashboard

            </h3>

            <p>

                Administrator tools and downloads.

            </p>

            <button
                onclick="navigate('admin')">

                Open

            </button>

        </div>

    </div>

</section>

</template>



<!-- =====================================================
                    SUBMIT TEMPLATE
====================================================== -->

<template id="submit-template">

<section class="page">

    <h2>

        Submit Feedback

    </h2>

    <div class="form-group">

        <label>

            Feedback

        </label>

        <textarea

            id="feedback"

            rows="10"

            placeholder="Enter your feedback">

        </textarea>

    </div>

    <div class="form-group">

        <label>

            <input

                id="anonymous"

                type="checkbox">

            Submit anonymously

        </label>

    </div>

    <button
        onclick="submitFeedback()">

        Submit Feedback

    </button>

    <div
        id="message"
        class="message">

    </div>

</section>

</template>



<!-- =====================================================
                MY FEEDBACK TEMPLATE
====================================================== -->

<template id="my-feedback-template">

<section class="page">

    <div class="page-header">

        <h2>

            My Feedback

        </h2>

        <button
            onclick="loadMyFeedback()">

            Refresh

        </button>

    </div>

    <div

        id="feedback-preview"

        class="feedback-list">

    </div>

</section>

</template>



<!-- =====================================================
                ADMIN TEMPLATE
====================================================== -->

<template id="admin-template">

<section class="page">

    <div class="page-header">

        <h2>

            Admin Dashboard

        </h2>

        <button
            onclick="loadAdminFeedback()">

            Refresh

        </button>

    </div>

    <div class="admin-toolbar">

        <input

            id="search"

            type="text"

            placeholder="Search feedback">

        <select id="sort-order">

            <option value="latest">

                Latest

            </option>

            <option value="oldest">

                Oldest

            </option>

        </select>

    </div>

    <div

        id="feedback-preview"

        class="feedback-list">

    </div>

</section>

</template>



<script src="scripts.js"></script>

</body>

</html>
